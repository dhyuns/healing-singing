<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>healingsinging</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 13h24c0 8-5 13-12 13S4 21 4 13z' fill='%239c7442'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-CjBYdqIn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DcXBGWOm.css">
  </head>
  <body>
    <main id="stage"></main>

    <header class="top">
      <h1>healingsinging</h1>
      <div class="actions">
        <button type="button" data-reaction="wave" aria-label="다른 방문객에게 손 인사">손 인사</button>
        <button type="button" data-reaction="thanks" aria-label="감사 표현하기">감사</button>
        <button type="button" class="outfit">옷 바꾸기</button>
        <button type="button" class="listen">누워서 듣기</button>
        <button type="button" class="stand">볼 앞에 앉기</button>
        <nav class="bowls" aria-label="싱잉볼 고르기" hidden></nav>
      </div>
    </header>

    <div class="zone-controls">
      <button type="button" class="zone-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="zone-menu">☰</button>
      <nav class="zone-menu" id="zone-menu" aria-label="공간 메뉴" hidden>
        <span>지금 머무는 곳</span>
        <button type="button" class="zone-current" aria-haspopup="dialog">샬라존01 ▾</button>
      </nav>
    </div>
    <p class="listener-count" aria-live="polite">잠시 쉬어갈 곳에 들어가 보세요</p>
    <dialog class="zone-dialog" aria-labelledby="zone-title">
      <div class="zone-heading"><h2 id="zone-title">머무를 곳</h2><button type="button" class="zone-close" aria-label="닫기">×</button></div>
      <p class="zone-notice" role="status">어느 존에서도 같은 공간을 이용할 수 있어요.</p>
      <div class="zone-toolbar"><span>함께 머무는 사람들</span><button type="button" class="zone-refresh">인원 새로고침</button></div>
      <div class="zone-list"></div>
    </dialog>

    <footer class="bottom">
      <p class="hint">드래그해서 둘러보세요</p>
      <div class="sound">
        <div class="volumes" id="volume-panel">
          <label class="volume">
            <span>소리</span>
            <input class="master-volume" type="range" min="0" max="1" step="0.01" aria-label="전체 소리 크기" />
          </label>
          <label class="volume">
            <span>자연</span>
            <input class="nature-volume" type="range" min="0" max="1" step="0.01" aria-label="폭포 등 자연 소리 크기" />
          </label>
        </div>
        <button type="button" class="sound-toggle" aria-label="소리 조절" aria-expanded="false" aria-controls="volume-panel">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" />
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </footer>

    <div class="intro">
      <button type="button" class="start">들어가기</button>
      <p>소리가 나요. 이어폰을 추천해요.</p>
    </div>

  </body>
</html>
